<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/links.css?cache=cock">
    <link rel="stylesheet" href="css/particles.css?cache=cock">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Platypi:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <title>Dreamy Lounge Links</title>
    <link rel="icon" href="https://klabisot.art/img/avatar.png">

    <meta name="theme-color" content="#b4afee">
    <meta content="Dreamy Lounge Links" property="og:title" />
    <meta content="I love you all" property="og:description" />
    <meta content="https://klabisot.art/links" property="og:url" />
    <meta content="https://klabisot.art/img/avatar.png" property="og:image" />
    <meta name="twitter:card" content="https://klabisot.art/img/doremy2.jpg">
</head>
<body>

    <div id="bg"></div>
    <div id="particles"></div>
    <div id="bg-blend"></div>

    <div class="container">
        <div class="artist-name">
            <img src="../img/doremy2.jpg">
            <h1>Dreamy Lounge</h1>
            <p class="aka">aka klabisot</p>
        </div>

        <div class="split-links">
            <div class="column column-left">
                <a href="https://x.com/klabisot" class="link" target="_blank">
                    <i class="fa-brands fa-twitter"></i>
                    <p>Twitter</p>
                </a>
                <a href="https://www.pixiv.net/en/users/28984542" class="link" target="_blank">
                    <i class="fa-brands fa-pixiv"></i>
                    <p>Pixiv</p>
                </a>
                <a href="https://bsky.app/profile/klabisot.bsky.social" class="link" target="_blank">
                    <i class="fa-brands fa-bluesky"></i>
                    <p>Bluesky</p>
                </a>
                <a href="https://www.tumblr.com/klabisot" class="link" target="_blank">
                    <i class="fa-brands fa-tumblr"></i>
                    <p>Tumblr</p>
                </a>
            </div>
            <div class="column column-right">
                <a href="https://x.com/klabisot_part2" class="link" target="_blank">
                    <i class="fa-brands fa-twitter"></i>
                    <p>Twitter Part 2 <span class="sub">alt acc, inactive</span></p>
                </a>
                <a href="https://vgen.co/klabisot" class="link" target="_blank">
                    <img id="vgen-icon" src="../img/vgen.png">
                    <p>VGen</p>
                </a>
                <a href="https://klabisot.fanbox.cc/" class="link" target="_blank">
                    <i class="fa-brands fa-pixiv"></i>
                    <p>FANBOX</p>
                </a>
                <a href="/pricelist" class="link">
                    <i class="fa-solid fa-certificate"></i>
                    <p>Commissions (open)</p>
                </a>
                <!-- <a href="https://ko-fi.com/klabisot" class="link tip-jar" target="_blank">
                    <i class="fa-solid fa-mug-hot"></i>
                    <p>Buy me a coffee</p>
                </a> -->
            </div>
        </div>
    </div>

    <div class="guestbook-sidebar" id="guestbook-sidebar">
        <h2>Ask me anything!</h2>
        <label for="gb-nick">Your name</label>
        <input type="text" id="gb-nick" placeholder="optional..." maxlength="100" autocomplete="off">
        <label for="gb-text">Message</label>
        <textarea id="gb-text" placeholder="hi!" maxlength="1000"></textarea>
        <div class="gb-actions">
            <span class="gb-feedback" id="gb-feedback"></span>
            <button class="gb-send" id="gb-send">Send</button>
        </div>
    </div>

    <div class="player-wrapper">
        <div class="status-float" id="status-float">
            <div class="now-playing" id="now-playing">
                <button class="np-play" id="np-play">
                    <i class="fa-solid fa-play"></i>
                </button>
                <div class="np-main">
                    <div class="np-info">
                        <span class="np-track"></span>
                        <span class="np-artist"></span>
                    </div>
                    <div class="np-seek-row">
                        <span class="np-time-current">0:00</span>
                        <input type="range" class="np-seek" id="np-seek" min="0" max="100" value="0" step="0.1">
                        <span class="np-time-total">0:00</span>
                        <button class="np-vol-btn" id="np-vol-btn">
                            <i class="fa-solid fa-volume-low"></i>
                            <div class="np-vol-popover" id="np-vol-popover">
                                <input type="range" class="np-volume" id="np-volume" min="0" max="100" value="20">
                            </div>
                        </button>
                    </div>
                </div>
            </div>
            <div class="np-player" id="np-player"></div>
        </div>
    </div>

    <div class="footer-bar">
        <span class="greeting"></span>
        <span class="dot">·</span>
        <span class="visits"></span>
    </div>

    <script src="js/links.js?cache=cock"></script>
    <script src="js/background.js?cache=cock"></script>
</body>
</html>
